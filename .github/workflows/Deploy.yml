name: Build and deploy Hugo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.169.0'
  TZ: Europe/Brussels

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore Hugo binary
        id: hugo-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo
          key: ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-go1.27.3-standard-v1

      - name: Set up Go
        if: steps.hugo-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      # Avoid the release-archive endpoint that repeatedly returned HTTP 504.
      - name: Build Hugo from source
        if: steps.hugo-cache.outputs.cache-hit != 'true'
        env:
          CGO_ENABLED: '0'
          GOPROXY: https://proxy.golang.org
          GOBIN: ${{ runner.temp }}/hugo
        run: go install "github.com/gohugoio/hugo@v${HUGO_VERSION}"

      - name: Add Hugo to PATH
        run: |
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo version
          hugo --gc --minify --baseURL "${HUGO_BASE_URL%/}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
